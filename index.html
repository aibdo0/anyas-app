<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#f5f5f7"
  >

  <title>أنياس</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background: #f5f5f7;

      color: #1c1c1e;

      min-height: 100vh;

    }


    .app {

      width: 100%;

      max-width: 520px;

      min-height: 100vh;

      margin: auto;

      padding-bottom: 100px;

    }


    /* =========================
       الهيدر
    ========================= */

    header {

      padding: 24px 20px 14px;

    }


    .brand {

      font-size: 28px;

      font-weight: 700;

    }


    .date {

      margin-top: 5px;

      font-size: 14px;

      color: #8e8e93;

    }


    /* =========================
       الصلاة القادمة
    ========================= */

    .next-prayer {

      margin: 10px 16px 18px;

      padding: 26px 22px;

      background: #ffffff;

      border-radius: 28px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.05);

    }


    .next-label {

      font-size: 14px;

      color: #8e8e93;

      margin-bottom: 8px;

    }


    .prayer-name {

      font-size: 30px;

      font-weight: 700;

      margin-bottom: 5px;

    }


    .prayer-time {

      font-size: 20px;

      color: #636366;

    }


    .countdown {

      margin-top: 15px;

      font-size: 16px;

      font-weight: 600;

      color: #007aff;

    }


    /* =========================
       الأقسام
    ========================= */

    .section {

      padding: 0 16px;

    }


    .section-title {

      font-size: 19px;

      font-weight: 700;

      margin: 20px 4px 12px;

    }


    /* =========================
       مواقيت الصلاة
    ========================= */

    .prayer-list {

      background: #ffffff;

      border-radius: 24px;

      overflow: hidden;

    }


    .prayer-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 17px 20px;

      border-bottom:
        1px solid #f0f0f2;

    }


    .prayer-row:last-child {

      border-bottom: none;

    }


    .prayer-title {

      font-size: 16px;

      font-weight: 500;

    }


    .prayer-value {

      font-size: 16px;

      font-weight: 600;

      color: #636366;

    }


    /* =========================
       الكروت
    ========================= */

    .card {

      margin-top: 18px;

      padding: 22px;

      background: #ffffff;

      border-radius: 24px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.035);

    }


    .card-title {

      font-size: 15px;

      color: #8e8e93;

      margin-bottom: 14px;

    }


    .ayah {

      font-size: 21px;

      line-height: 1.9;

      font-weight: 500;

    }


    .reference {

      margin-top: 12px;

      font-size: 13px;

      color: #8e8e93;

    }


    .dhikr {

      font-size: 20px;

      line-height: 1.9;

    }


    /* =========================
       زر الأذان
    ========================= */

    .adhan-button {

      margin-top: 18px;

      width: 100%;

      border: none;

      border-radius: 18px;

      padding: 15px;

      font-size: 16px;

      font-weight: 600;

      background: #007aff;

      color: #ffffff;

      cursor: pointer;

      transition: 0.2s;

    }


    .adhan-button:active {

      transform: scale(0.97);

    }


    /* =========================
       إعدادات الصوت
    ========================= */

    .setting-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 15px 0;

      border-bottom:
        1px solid #f0f0f2;

    }


    .setting-row:last-child {

      border-bottom: none;

    }


    .setting-title {

      font-size: 16px;

      font-weight: 600;

    }


    .setting-description {

      margin-top: 5px;

      font-size: 13px;

      color: #8e8e93;

    }


    /* =========================
       السويتش
    ========================= */

    .switch {

      position: relative;

      width: 52px;

      height: 32px;

      flex-shrink: 0;

    }


    .switch input {

      display: none;

    }


    .switch-track {

      position: absolute;

      inset: 0;

      background: #d1d1d6;

      border-radius: 20px;

      transition: 0.2s;

    }


    .switch-knob {

      position: absolute;

      width: 28px;

      height: 28px;

      top: 2px;

      right: 22px;

      background: #ffffff;

      border-radius: 50%;

      box-shadow:
        0 2px 5px rgba(0,0,0,0.2);

      transition: 0.2s;

    }


    .switch input:checked
    + .switch-track {

      background: #34c759;

    }


    .switch input:checked
    + .switch-track
    + .switch-knob {

      right: 2px;

    }


    /* =========================
       مستوى الصوت
    ========================= */

    .volume-container {

      padding: 18px 0;

    }


    .volume-header {

      display: flex;

      justify-content: space-between;

      margin-bottom: 10px;

    }


    .volume-title {

      font-size: 16px;

      font-weight: 600;

    }


    .volume-value {

      font-size: 14px;

      color: #8e8e93;

    }


    #adhanVolume {

      width: 100%;

      accent-color: #007aff;

    }


    /* =========================
       القائمة السفلية
    ========================= */

      bottom: 12px;

      left: 50%;
