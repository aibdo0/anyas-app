import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

def webRoot = rootProject.projectDir.parentFile
def appVersionSource = new File(webRoot, 'data/config/app-version.js').text
def appVersionMatch = appVersionSource =~ /window\.ANIAS_APP_VERSION\s*=\s*"([^"]+)"/
def appVersionCodeMatch = appVersionSource =~ /window\.ANIAS_VERSION_CODE\s*=\s*(\d+)/
if (!appVersionMatch.find() || !appVersionCodeMatch.find()) {
    throw new GradleException('Missing centralized Anias version data in data/config/app-version.js')
}
def centralizedVersionName = appVersionMatch.group(1)
def centralizedVersionCode = Integer.parseInt(appVersionCodeMatch.group(1))
def releaseStoreFile = System.getenv('ANYAS_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('ANYAS_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANYAS_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANYAS_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.anyas.app'
    compileSdk 35

    buildFeatures { compose true }

    sourceSets {
        main { assets.srcDirs = [new File(buildDir, 'generated/nativeAzkarAssets')] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    kotlinOptions { jvmTarget = '17' }

    defaultConfig {
        applicationId 'com.anyas.app'
        minSdk 23
        targetSdk 34
        versionCode centralizedVersionCode
        versionName centralizedVersionName
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'com.batoulapps.adhan:adhan:1.2.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}

kapt {
    correctErrorTypes = true
    arguments { arg("room.schemaLocation", "$projectDir/schemas") }
}

tasks.register('syncNativeAzkarContent') {
    def sourceFile = new File(webRoot, 'data/content/azkar-topics.js')
    def outputFile = layout.buildDirectory.file('generated/nativeAzkarAssets/azkar-topics.json').get().asFile
    inputs.file(sourceFile)
    outputs.file(outputFile)
    doLast {
        def source = sourceFile.getText('UTF-8')
        def start = source.indexOf('[')
        def end = source.lastIndexOf(']')
        if (start < 0 || end <= start) throw new GradleException('Could not extract the Azkar JSON array.')
        outputFile.parentFile.mkdirs()
        outputFile.setText(source.substring(start, end + 1), 'UTF-8')
    }
}

tasks.register('syncReminderAudio') {
    doLast {
        def sourceDir = new File(webRoot, 'audio')
        def targetDir = file('src/main/res/raw')
        targetDir.mkdirs()

        def catalogFile = new File(webRoot, 'data/config/audio-catalog.json')
        if (!catalogFile.isFile()) throw new GradleException("Missing audio catalog: ${catalogFile}")
        def catalog = new JsonSlurper().parse(catalogFile)
        def bundledEntries = catalog.audio.findAll { it.bundled && it.androidResource }
        if (bundledEntries.isEmpty()) throw new GradleException('No bundled Android audio entries were found.')
        def duplicateResources = bundledEntries.groupBy { it.androidResource }.findAll { key, values -> values.size() > 1 }.keySet()
        if (!duplicateResources.isEmpty()) throw new GradleException("Duplicate Android audio resources: ${duplicateResources.join(', ')}")

        // Remove stale generated MP3 copies from previous builds, keeping non-MP3 resources intact.
        (targetDir.listFiles()?.findAll { it.isFile() && it.name.toLowerCase().endsWith('.mp3') } ?: []).each { existing ->
            if (!existing.delete()) throw new GradleException("Could not remove stale reminder audio: ${existing}")
        }

        bundledEntries.sort { a, b -> a.androidResource <=> b.androidResource }.each { entry ->
            def source = new File(webRoot, entry.webPath)
            if (!source.isFile()) throw new GradleException("Missing catalog audio source: ${entry.webPath}")
            copy {
                from source
                into targetDir
                rename { entry.androidResource + '.mp3' }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('syncReminderAudio', 'syncNativeAzkarContent') }
