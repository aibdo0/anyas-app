plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.anyas.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anyas.app'
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName '1.1.5'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

def webRoot = rootProject.projectDir.parentFile
tasks.register('syncWebAssets', Copy) {
    from(webRoot) {
        include 'index.html', 'css/**', 'js/**', 'data/**', 'assets/**', 'audio/**'
    }
    into layout.projectDirectory.dir('src/main/assets')
}
tasks.register('syncReminderAudio') {
    doLast {
        def sourceDir = new File(webRoot, 'audio')
        def targetDir = file('src/main/res/raw')
        targetDir.mkdirs()

        // Only duplicate MP3s referenced by Android background reminder entry points.
        def javaAudioSources = [
            file('src/main/java/com/anyas/app/ReminderScheduler.java'),
            file('src/main/java/com/anyas/app/RainReceiver.java')
        ]
        def reminderAudioNames = new LinkedHashSet()
        javaAudioSources.each { javaSource ->
            if (!javaSource.isFile()) throw new GradleException("Missing reminder audio source: ${javaSource}")
            def matcher = javaSource.text =~ /"([^"]+\.mp3)"/
            matcher.each { match -> reminderAudioNames.add(match[1]) }
        }
        if (reminderAudioNames.isEmpty()) throw new GradleException('No Android reminder audio files were found.')

        def missingAudio = reminderAudioNames.findAll { name -> !new File(sourceDir, name).isFile() }
        if (!missingAudio.isEmpty()) throw new GradleException("Missing reminder audio files: ${missingAudio.join(', ')}")

        // Remove stale generated MP3 copies from previous builds, keeping non-MP3 resources intact.
        (targetDir.listFiles()?.findAll { it.isFile() && it.name.toLowerCase().endsWith('.mp3') } ?: []).each { existing ->
            if (!existing.delete()) throw new GradleException("Could not remove stale reminder audio: ${existing}")
        }

        reminderAudioNames.sort().each { audioName ->
            def source = new File(sourceDir, audioName)
            def base = audioName.substring(0, audioName.length() - 4)
            def safe = base.toLowerCase().replaceAll('[^a-z0-9_]', '_')
            copy {
                from source
                into targetDir
                rename { safe + '.mp3' }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('syncWebAssets', 'syncReminderAudio') }
