<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#0f6b4f">

  <title>أنياس</title>

  <!-- التصميم -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =========================
       التطبيق
  ========================== -->

  <div id="app">

    <!-- الهيدر -->
    <header id="appHeader">
      <h1>أنياس</h1>
    </header>


    <!-- =========================
         الصفحات الرئيسية
    ========================== -->

    <main id="mainContent">

      <!-- الرئيسية -->
      <section id="homePage" class="page active">
        الرئيسية
      </section>


      <!-- الصلاة -->
      <section id="prayerPage" class="page">

  <div class="card prayer-header">

    <div class="location-title">
      📍 <span id="locationName">جاري تحديد موقعك...</span>
    </div>

    <div class="next-prayer-title">
      الصلاة القادمة
    </div>

    <div id="nextPrayerName" class="next-prayer-name">
      جاري الحساب...
    </div>

    <div id="countdown" class="prayer-countdown">
      --:--
    </div>

  </div>


  <div class="prayer-times">

    <div class="prayer-card">
      <div class="prayer-icon">🌅</div>
      <div class="prayer-name">الفجر</div>
      <div id="fajrTime" class="prayer-time">--:--</div>
    </div>

    <div class="prayer-card">
      <div class="prayer-icon">☀️</div>
      <div class="prayer-name">الشروق</div>
      <div id="sunriseTime" class="prayer-time">--:--</div>
    </div>

    <div class="prayer-card">
      <div class="prayer-icon">☀️</div>
      <div class="prayer-name">الظهر</div>
      <div id="dhuhrTime" class="prayer-time">--:--</div>
    </div>

    <div class="prayer-card">
      <div class="prayer-icon">🌤️</div>
      <div class="prayer-name">العصر</div>
      <div id="asrTime" class="prayer-time">--:--</div>
    </div>

    <div class="prayer-card">
      <div class="prayer-icon">🌇</div>
      <div class="prayer-name">المغرب</div>
      <div id="maghribTime" class="prayer-time">--:--</div>
    </div>

    <div class="prayer-card">
      <div class="prayer-icon">🌙</div>
      <div class="prayer-name">العشاء</div>
      <div id="ishaTime" class="prayer-time">--:--</div>
    </div>

  </div>

      </section>


      <!-- الأذكار -->
      <section id="azkarPage" class="page">
        الأذكار
      </section>


      <!-- الأدعية -->
      <section id="duasPage" class="page">
        الأدعية
      </section>


      <!-- القبلة -->
      <section id="qiblaPage" class="page">
        القبلة
      </section>


      <!-- الإعدادات -->
      <section id="settingsPage" class="page">
        الإعدادات
      </section>

    </main>


    <!-- =========================
         شريط التنقل السفلي
    ========================== -->

    <nav id="bottomNavigation">

      <button data-page="homePage">
        الرئيسية
      </button>

      <button data-page="prayerPage">
        الصلاة
      </button>

      <button data-page="azkarPage">
        الأذكار
      </button>

      <button data-page="duasPage">
        الأدعية
      </button>

      <button data-page="settingsPage">
        الإعدادات
      </button>

    </nav>

  </div>


  <!-- =========================
       JavaScript
  ========================== -->

<script src="azkar-topics.js"></script>

<script src="js/script-new.js"></script>
</body>

</html>
