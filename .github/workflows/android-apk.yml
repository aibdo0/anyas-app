name: Android APK
on:
  push:
    branches:
      - main
      - android/apk-wrapper
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANYAS_KEYSTORE_BASE64: ${{ secrets.ANYAS_KEYSTORE_BASE64 }}
      ANYAS_RELEASE_STORE_PASSWORD: ${{ secrets.ANYAS_RELEASE_STORE_PASSWORD }}
      ANYAS_RELEASE_KEY_ALIAS: ${{ secrets.ANYAS_RELEASE_KEY_ALIAS }}
      ANYAS_RELEASE_KEY_PASSWORD: ${{ secrets.ANYAS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js data/*.js; do
            node --check "$file"
          done
      - name: Run app smoke tests
        run: node tests/smoke.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: anyas-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare release keystore
        if: ${{ env.ANYAS_KEYSTORE_BASE64 != '' && env.ANYAS_RELEASE_STORE_PASSWORD != '' && env.ANYAS_RELEASE_KEY_ALIAS != '' && env.ANYAS_RELEASE_KEY_PASSWORD != '' }}
        run: echo "$ANYAS_KEYSTORE_BASE64" | base64 --decode > android/anyas-release.jks
      - name: Build signed release AAB
        if: ${{ env.ANYAS_KEYSTORE_BASE64 != '' && env.ANYAS_RELEASE_STORE_PASSWORD != '' && env.ANYAS_RELEASE_KEY_ALIAS != '' && env.ANYAS_RELEASE_KEY_PASSWORD != '' }}
        env:
          ANYAS_RELEASE_STORE_FILE: ../anyas-release.jks
        run: gradle --no-daemon -p android bundleRelease
      - name: Upload signed release AAB
        if: ${{ env.ANYAS_KEYSTORE_BASE64 != '' && env.ANYAS_RELEASE_STORE_PASSWORD != '' && env.ANYAS_RELEASE_KEY_ALIAS != '' && env.ANYAS_RELEASE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: anyas-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
